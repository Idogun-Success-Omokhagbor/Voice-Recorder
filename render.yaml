services:
  - type: web
    name: voice-recorder-plus-email
    runtime: node
    plan: free
    rootDir: email-backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: EMAIL_TRANSPORT
        value: google_apps_script
      - key: SMTP_FROM_NAME
        value: Voice Recorder Plus
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: BACKEND_BEARER_TOKEN
        sync: false
