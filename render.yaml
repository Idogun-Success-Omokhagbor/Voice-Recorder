services:
  - type: web
    name: voice-recorder-plus-email
    runtime: node
    plan: free
    rootDir: email-backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: EMAIL_TRANSPORT
        value: api
      - key: SMTP_FROM_NAME
        value: Voice Recorder Plus
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: BACKEND_BEARER_TOKEN
        sync: false
