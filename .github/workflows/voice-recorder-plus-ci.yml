name: Voice Recorder Plus CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: voice-recorder-plus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Test Brevo email backend
        run: pnpm --dir email-backend install --frozen-lockfile && pnpm --dir email-backend test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Foss debug APK
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Run Android lint
        run: ./gradlew --no-daemon lintFossDebug

      - name: Run Detekt
        run: ./gradlew --no-daemon detekt

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testFossDebugUnitTest

      - name: Upload Foss debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-recorder-plus-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
